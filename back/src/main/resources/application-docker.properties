# Profile "docker": enabled by docker-compose.yml (SPRING_PROFILES_ACTIVE=docker).
# Logs are written to stdout in a machine-readable form, collected by Filebeat and sent to ELK
# (docker-compose-elk.yml). Local development (bootRun) and tests keep the default human-readable logs.

# Application logs: one JSON object per line, Elastic Common Schema (ECS) fields (level, logger, message, error...)
logging.structured.format.console=ecs
logging.structured.ecs.service.name=microcrm-back

# HTTP access log: one JSON line per request handled by the API (method, path, status, duration).
# Tomcat writes it to the container's stdout, next to the application logs.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern={"log_type":"access","method":"%m","path":"%U","query":"%q","status":%s,"bytes":"%b","duration_ms":%{ms}T,"user_agent":"%{User-Agent}i"}
