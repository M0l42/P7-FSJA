# Logstash pipeline: receives container logs from Filebeat, turns them into ECS documents, writes them to Elasticsearch.
#   back  : ECS JSON application logs (Spring Boot) + JSON HTTP access log (Tomcat)
#   front : JSON access log (Caddy)
# Every access log gets the same fields: http.request.method, url.path, http.response.status_code,
# response_time_ms, event.outcome and a log.level derived from the status (5xx = ERROR, 4xx = WARN).

input {
  beats { port => 5044 }
}

filter {
  mutate { add_field => { "[@metadata][svc]" => "%{[container][labels][com_docker_compose_service]}" } }

  json { source => "message" target => "[@metadata][raw]" skip_on_invalid_json => true }

  # ---------------------------------------------------------------- back-end (Spring Boot)
  if [@metadata][svc] == "back" {
    mutate { replace => { "[service][name]" => "microcrm-back" } }

    if [@metadata][raw][log_type] == "access" {
      # Docker healthcheck (wget on / every 10 s): not real traffic
      if [@metadata][raw][user_agent] =~ /^Wget/ { drop {} }
      mutate {
        replace => {
          "[event][dataset]"              => "microcrm.access"
          "[http][request][method]"       => "%{[@metadata][raw][method]}"
          "[url][path]"                   => "%{[@metadata][raw][path]}"
          "[http][response][status_code]" => "%{[@metadata][raw][status]}"
          "response_time_ms"              => "%{[@metadata][raw][duration_ms]}"
          "message"                       => "%{[@metadata][raw][method]} %{[@metadata][raw][path]} %{[@metadata][raw][status]} %{[@metadata][raw][duration_ms]}ms"
        }
      }
      if [@metadata][raw][query] != "-" { mutate { replace => { "[url][query]" => "%{[@metadata][raw][query]}" } } }
      if [@metadata][raw][bytes] != "-" { mutate { replace => { "[http][response][body][bytes]" => "%{[@metadata][raw][bytes]}" } } }
    } else if [@metadata][raw][log] {
      # ECS application log: keep its fields as they are
      ruby {
        code => '
          raw = event.get("[@metadata][raw]")
          raw.each { |k, v| event.set(k, v) unless k == "@timestamp" }
        '
      }
      date { match => ["[@metadata][raw][@timestamp]", "ISO8601"] }
      mutate { replace => { "[event][dataset]" => "microcrm.app" } }
    }
  }

  # ---------------------------------------------------------------- front-end (Caddy)
  else if [@metadata][svc] == "front" {
    mutate { replace => { "[service][name]" => "microcrm-front" } }

    if [@metadata][raw][logger] =~ /^http\.log\.access/ {
      ruby {
        code => '
          raw = event.get("[@metadata][raw]")
          req = raw["request"] || {}
          event.set("[event][dataset]", "microcrm.access")
          event.set("[http][request][method]", req["method"])
          path, query = (req["uri"] || "").split("?", 2)
          event.set("[url][path]", path)
          event.set("[url][query]", query) if query
          event.set("[http][response][status_code]", raw["status"])
          event.set("[http][response][body][bytes]", raw["size"])
          event.set("response_time_ms", ((raw["duration"] || 0) * 1000.0).round(3))
          event.set("message", "#{req["method"]} #{req["uri"]} #{raw["status"]}")
          # Privacy by design: client IP and request headers are not kept
        '
      }
    } else if [@metadata][raw][level] {
      # Caddy's own logs (startup, errors)
      mutate {
        replace => { "[event][dataset]" => "microcrm.app" "message" => "%{[@metadata][raw][msg]}" "[log][logger]" => "%{[@metadata][raw][logger]}" }
      }
      mutate { replace => { "[log][level]" => "%{[@metadata][raw][level]}" } }
      mutate { uppercase => ["[log][level]"] }
    }
  }

  # ---------------------------------------------------------------- common to both access logs
  if [event][dataset] == "microcrm.access" {
    mutate { convert => { "[http][response][status_code]" => "integer" "response_time_ms" => "float" "[http][response][body][bytes]" => "integer" } }
    if [http][response][status_code] >= 500 {
      mutate { replace => { "[log][level]" => "ERROR" "[event][outcome]" => "failure" } }
    } else if [http][response][status_code] >= 400 {
      mutate { replace => { "[log][level]" => "WARN" "[event][outcome]" => "failure" } }
    } else {
      mutate { replace => { "[log][level]" => "INFO" "[event][outcome]" => "success" } }
    }
  }

  # Keep the useful container metadata only
  mutate {
    # event.original (raw line, with the user agent) is redundant once parsed: not kept
    remove_field => ["[container][labels]", "[docker]", "[agent]", "[input]", "[log][file]", "[log][offset]", "[stream]", "[ecs]", "[host]", "[tags]", "[event][original]"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
    index    => "microcrm-logs-%{+YYYY.MM.dd}"
  }
}
