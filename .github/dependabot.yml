# Dependabot version updates: weekly PRs that keep dependencies, base images and actions up to date.
# Security plan: docs/documentation-technique.md, section 5. Each PR goes through CI and the SonarQube gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch: # one PR for all non-breaking updates; major versions get their own PR
        update-types: [minor, patch]
    ignore:
      # Angular is upgraded as a whole with `ng update` (update plan, section 8), never package by package
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # Versions tied to the Angular version: zone.js (0.x, so a "minor" bump is breaking) and TypeScript
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: gradle
    directory: /back
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades of the framework and the build tool are planned work (update plan, section 8)
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directories: ["/back", "/front"] # one Dockerfile per component
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Java must match the compile target (17) and Node must stay compatible with Angular: majors are planned work
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
