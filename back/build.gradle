plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

// Security (SEC01): Spring Boot 3.5.16 ships Tomcat 10.1.55, affected by critical CVEs fixed in 10.1.58+.
// Remove this override once Spring Boot is upgraded (update plan, section 8).
ext['tomcat.version'] = '10.1.62'

// Lock resolved dependency versions in gradle.lockfile: reproducible builds, no silent version change.
// Update with: ./gradlew dependencies --write-locks
dependencyLocking {
	lockAllConfigurations()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Coverage report: XML for SonarQube Cloud, HTML for humans
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
