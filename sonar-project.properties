# SonarQube Cloud analysis: one project covering the back end (Java) and the front end (TypeScript).
# Run by the `sonar` job of .github/workflows/ci.yml. The token comes from the SONAR_TOKEN secret, never from this file.

sonar.organization=m0l42
sonar.projectKey=M0l42_P7-FSJA
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=back/src/main/java,front/src
sonar.tests=back/src/test/java,front/src
sonar.exclusions=front/src/**/*.spec.ts
sonar.test.inclusions=front/src/**/*.spec.ts

# Java: compiled classes produced by the `back` job
sonar.java.binaries=back/build/classes/java/main
sonar.java.test.binaries=back/build/classes/java/test

# Coverage reports produced by the `back` (JaCoCo) and `front` (Karma/Istanbul) jobs
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info

# Fail the job when the quality gate fails, so it can block pull requests
sonar.qualitygate.wait=true
