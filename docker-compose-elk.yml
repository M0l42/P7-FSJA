# Local monitoring stack (ELK) for MicroCRM: Filebeat -> Logstash -> Elasticsearch -> Kibana.
# Separate from docker-compose.yml: the application runs the same with or without it, and it is NOT part of CI/CD.
#
#   cp .env.example .env    # then set the three passwords (never committed)
#   make elk-up             # docker compose -f docker-compose-elk.yml up -d --wait
#   Kibana: http://localhost:5601  (user: elastic, password: ELASTIC_PASSWORD)
#
# Needs about 3 GB of free RAM (memory limits below). Security: authentication on, no TLS, ports on 127.0.0.1 only.
# Monitoring plan: docs/documentation-technique.md, section 6.

name: microcrm-elk

services:
  # One-shot: waits for Elasticsearch, then sets the Kibana password, creates a least-privilege
  # user for Logstash and the index template of the logs. Exits when done.
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set it in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?set it in .env}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?set it in .env}
    volumes:
      - ./elk/setup.sh:/setup.sh:ro
    entrypoint: ["bash", "/setup.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set it in .env}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.26
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?set it in .env}
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    mem_limit: 768m
    depends_on:
      setup:
        condition: service_completed_successfully

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.26
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?set it in .env}
      NODE_OPTIONS: --max-old-space-size=700
      TELEMETRY_OPTIN: "false" # no usage data sent to Elastic
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
    ports:
      - "127.0.0.1:5601:5601"
    mem_limit: 1g
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Reads the log files Docker already writes for every container (read-only) and keeps only
  # the MicroCRM services (back, front). Runs as root to read Docker's log folder.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.26
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    mem_limit: 256m
    depends_on:
      - logstash

volumes:
  es-data:
  filebeat-data:
